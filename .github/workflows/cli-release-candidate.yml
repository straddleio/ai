# PATCH: public-release-candidate-workflow keeps public launch review executable without publishing.
name: CLI Release Candidate Review

# Manual-only, non-publishing candidate review. This workflow never runs from
# push or tag events, and it does not create GitHub releases, publish npm or
# Homebrew packages, sign, notarize, call Straddle APIs, or require secrets.
on:
  workflow_dispatch:
    inputs:
      candidate_label:
        description: "Review label for this public release candidate, letters, numbers, dots, underscores, and hyphens only"
        required: true
        type: string
      candidate_ref:
        description: "Git ref to check out for the candidate build. Defaults to the dispatched ref."
        required: false
        type: string
      approval_json:
        description: "Strict shipcheck public approval JSON. Do not include secrets. Use this or approval_json_base64, not both."
        required: false
        type: string
      approval_json_base64:
        description: "Base64-encoded strict shipcheck public approval JSON. Do not include secrets. Use this or approval_json, not both."
        required: false
        type: string

permissions:
  contents: read
  # No repository write permission. The workflow only attaches a run artifact.
  actions: read

jobs:
  review:
    name: Build and review CLI candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/cli/straddle-pp-cli/go.mod
          cache-dependency-path: packages/cli/straddle-pp-cli/go.sum

      - name: Sync plugin files
        run: npm run sync

      - name: Validate plugin structure
        run: npm run validate

      - name: Validate generated CLI files
        run: node scripts/validate-cli.js

      - name: Run Go tests
        run: make test
        working-directory: packages/cli/straddle-pp-cli

      - name: Build non-publishing release artifacts
        run: make release-readiness
        working-directory: packages/cli/straddle-pp-cli

      - name: Validate public approval against built CLI
        run: sh scripts/ci-public-release-candidate.sh
        working-directory: packages/cli/straddle-pp-cli
        env:
          CANDIDATE_LABEL: ${{ inputs.candidate_label }}
          APPROVAL_JSON: ${{ inputs.approval_json }}
          APPROVAL_JSON_BASE64: ${{ inputs.approval_json_base64 }}

      - name: Upload candidate artifacts for review
        uses: actions/upload-artifact@v6
        with:
          name: straddle-pp-cli-release-candidate-${{ github.run_id }}
          path: packages/cli/straddle-pp-cli/dist
          if-no-files-found: error
          retention-days: 14

name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version-file: packages/cli/straddle-pp-cli/go.mod
      - run: npm run sync
      - run: npm run validate
      - run: node scripts/validate-cli.js
      - run: make completion-audit
        working-directory: packages/cli/straddle-pp-cli
      - if: always()
        run: make clean
        working-directory: packages/cli/straddle-pp-cli

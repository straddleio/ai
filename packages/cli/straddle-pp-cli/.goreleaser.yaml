version: 2
project_name: straddle-pp-cli
changelog:
  disable: true
builds:
  - id: straddle-pp-cli
    main: ./cmd/straddle-pp-cli
    binary: straddle-pp-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X straddle-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: straddle-pp-mcp
    main: ./cmd/straddle-pp-mcp
    binary: straddle-pp-mcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - ids:
      - straddle-pp-cli
      - straddle-pp-mcp
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - .printing-press.json
      - manifest.json
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
homebrew_casks:
  - name: straddle-pp-cli
    repository:
      owner: straddleio
      name: homebrew-tap
    homepage: "https://github.com/straddleio/ai/tree/main/packages/cli/straddle-pp-cli"
    description: "Generated Straddle API CLI with MCP stdio sibling"
    binaries:
      - straddle-pp-cli
      - straddle-pp-mcp
